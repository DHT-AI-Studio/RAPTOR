# Kafka Log4j Configuration
# /modules/03-kafka-cluster/config/log4j.properties

log4j.rootLogger=WARN, stdout

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

# Controller logs
log4j.logger.org.apache.kafka.controller=INFO
log4j.logger.org.apache.kafka.raft=WARN

# Metadata logs
log4j.logger.org.apache.kafka.metadata=WARN

# Request processing
log4j.logger.kafka.request.logger=WARN
log4j.logger.kafka.network.RequestChannel$=WARN

# State change logs
log4j.logger.state.change.logger=INFO

# Log cleaner
log4j.logger.kafka.log.LogCleaner=INFO

# Reduce noise from common sources
log4j.logger.kafka.server.BrokerMetadataPublisher=WARN
log4j.logger.kafka.server.NodeToControllerChannelManager=WARN
