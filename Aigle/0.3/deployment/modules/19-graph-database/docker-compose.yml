# Graph Database Module — Neo4j
# Raptor Platform v0.3
# Deploy: docker-compose -f docker-compose.yml up -d

services:
  neo4j:
    image: neo4j:5.20-enterprise
    container_name: raptor-neo4j
    hostname: raptor-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-raptor0.3}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_connector_http_listen__address: "0.0.0.0:7474"
      # Prometheus metrics endpoint
      NEO4J_metrics_prometheus_enabled: "true"
      NEO4J_metrics_prometheus_endpoint: "0.0.0.0:2004"
      TZ: ${TIMEZONE:-Asia/Taipei}
    ports:
      - "${PORT_NEO4J_BROWSER:-7474}:7474"    # Browser UI
      - "${PORT_NEO4J_BOLT:-7687}:7687"    # Bolt protocol
      - "${PORT_NEO4J_METRICS:-2004}:2004"    # Prometheus metrics
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
      - ./init:/init:ro
    networks:
      raptor:
        aliases:
          - "raptor-neo4j"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: '4'

  neo4j-init:
    image: neo4j:5.20-enterprise
    container_name: raptor-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./init:/init:ro
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-raptor0.3}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
    command: >
      bash -c "
        cypher-shell -a bolt://raptor-neo4j:7687 -u $$NEO4J_USER -p $$NEO4J_PASSWORD -f /init/neo4j_init.cypher &&
        cypher-shell -a bolt://raptor-neo4j:7687 -u $$NEO4J_USER -p $$NEO4J_PASSWORD -f /init/migration_001_contextual_text.cypher &&
        cypher-shell -a bolt://raptor-neo4j:7687 -u $$NEO4J_USER -p $$NEO4J_PASSWORD -f /init/migration_002_tkg_neo4j_only.cypher
      "
    networks:
      raptor: {}
    restart: "no"

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
