# Image Processing Module
# Raptor Platform v0.3
# WORKER_TYPE selects the service (image_orchestrator / image_processing / image_indexer).
# GPU required for image-processing (InternVL 3.5-4B).
# Deploy: docker compose -f docker-compose.yml up -d

x-worker-common: &worker-common
  image: raptor/media-worker:0.3
  environment: &worker-env
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092}
    REDIS_HOST: ${REDIS_HOST:-raptor-redis-standalone}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    HYBRID_SEARCH_INGEST_URL: ${HYBRID_SEARCH_INGEST_URL:-http://raptor-hybridsearch-api:8000/api/v1/ingest/file}
    HF_TOKEN: ${HF_TOKEN}
    HF_HOME: /hf_cache
    TZ: ${TIMEZONE:-Asia/Taipei}
  volumes: &worker-volumes
    - ${HF_CACHE_PATH:-~/.cache/huggingface}:/hf_cache
    - media-tmp:/tmp/media_processing
  restart: unless-stopped
  networks:
    - raptor

services:
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.9.0
    container_name: raptor-image-kafka-init
    networks:
      - raptor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092}
    entrypoint: >
      /bin/bash -c "
        BS=$$(echo $$KAFKA_BOOTSTRAP_SERVERS | cut -d',' -f1);
        echo \"Waiting for Kafka at $$BS...\";
        until kafka-topics --bootstrap-server $$BS --list > /dev/null 2>&1; do
          sleep 5;
        done;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-processing-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-processing-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-description-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-description-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-ocr-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-ocr-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-indexer-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-indexer-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-processing-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic image-indexer-dlq --partitions 1 --replication-factor 3;
        echo 'Image topics ready.';
      "
    restart: "no"

  image-orchestrator:
    <<: *worker-common
    container_name: raptor-image-orchestrator
    hostname: raptor-image-orchestrator
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      <<: *worker-env
      WORKER_TYPE: image_orchestrator
    networks:
      raptor:
        aliases:
          - raptor-image-orchestrator
    deploy:
      resources:
        limits:
          memory: ${IMAGE_ORCHESTRATOR_MEMORY_LIMIT:-2g}
          cpus: '${IMAGE_ORCHESTRATOR_CPU_LIMIT:-1}'

  image-processing:
    <<: *worker-common
    container_name: raptor-image-processing
    hostname: raptor-image-processing
    environment:
      <<: *worker-env
      WORKER_TYPE: image_processing
      CUDA_VISIBLE_DEVICES: "0"
      VLM_MODEL_PATH: ${IMAGE_VLM_MODEL_PATH:-OpenGVLab/InternVL3_5-4B}
      MAX_MEMORY_PER_GPU: ${MAX_MEMORY_PER_GPU:-36GiB}
      IMAGE_SYNC_API_PORT: ${IMAGE_SYNC_API_PORT:-8018}
    ports:
      - "${IMAGE_SYNC_API_PORT:-8018}:${IMAGE_SYNC_API_PORT:-8018}"
    networks:
      raptor:
        aliases:
          - raptor-image-processing
    deploy:
      resources:
        limits:
          memory: ${IMAGE_PROCESSING_MEMORY_LIMIT:-20g}
          cpus: '${IMAGE_PROCESSING_CPU_LIMIT:-4}'
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${IMAGE_PROCESSING_GPU:-0}"]
              capabilities: [gpu]

  image-indexer:
    <<: *worker-common
    container_name: raptor-image-indexer
    hostname: raptor-image-indexer
    environment:
      <<: *worker-env
      WORKER_TYPE: image_indexer
    networks:
      raptor:
        aliases:
          - raptor-image-indexer
    deploy:
      resources:
        limits:
          memory: ${IMAGE_INDEXER_MEMORY_LIMIT:-2g}
          cpus: '${IMAGE_INDEXER_CPU_LIMIT:-1}'

  image-cleanup:
    image: busybox:1.36.1
    container_name: raptor-image-cleanup
    volumes:
      - media-tmp:/tmp/media_processing
    command:
      - sh
      - -c
      - |
        while true; do
          find /tmp/media_processing/image_processing -mindepth 1 -maxdepth 1 -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
          sleep 3600
        done
    restart: unless-stopped
    networks:
      - raptor

volumes:
  hf_cache: {}
  media-tmp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/disk1/nfs/media/processing

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
