services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: raptor/api-gateway:0.3
    container_name: raptor-api-gateway
    restart: always
    ports:
      - "${PORT_API_GATEWAY:-8012}:8012"
    env_file:
      - .env
      - path: ../.env
        required: false
    volumes:
      - ./app:/app/app
      - media-tmp:/tmp/media_processing
    networks:
      raptor:
        aliases:
          - "raptor-api-gatewar"
    labels:
      - "com.example.description=VIE FastAPI Gateway Application"

  upload-cleanup:
    image: busybox:1.36.1
    container_name: raptor-upload-cleanup
    volumes:
      - media-tmp:/tmp/media_processing
    command:
      - sh
      - -c
      - |
        while true; do
          find /tmp/media_processing/uploads -mindepth 1 -maxdepth 1 -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
          sleep 3600
        done
    restart: unless-stopped
    networks:
      - raptor

volumes:
  media-tmp:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4"
      device: ":${NFS_MEDIA_TMP_PATH}"

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}