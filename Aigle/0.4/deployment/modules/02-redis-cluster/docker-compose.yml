      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-announce-ip ${HOST_IP}
      --cluster-announce-port ${PORT_REDIS_CLUSTER_4:-7003}
      --cluster-announce-bus-port ${PORT_REDIS_CLUSTER_BUS_4:-17003}
    ports:
      - "${PORT_REDIS_CLUSTER_4:-7003}:${PORT_REDIS_CLUSTER_4:-7003}"
      - "${PORT_REDIS_CLUSTER_BUS_4:-17003}:${PORT_REDIS_CLUSTER_BUS_4:-17003}"
    volumes:
      - redis4-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
