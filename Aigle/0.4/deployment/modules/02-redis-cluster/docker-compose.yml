  redis5:
    image: redis:8.0.2
    container_name: raptor-redis5
    hostname: raptor-redis5
    profiles: ["cluster"]
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port ${PORT_REDIS_CLUSTER_5:-7004}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
