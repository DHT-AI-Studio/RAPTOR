      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  redis6:
    image: redis:8.0.2
    container_name: raptor-redis6
    hostname: raptor-redis6
    profiles: ["cluster"]
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port ${PORT_REDIS_CLUSTER_6:-7005}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-announce-ip ${HOST_IP}
      --cluster-announce-port ${PORT_REDIS_CLUSTER_6:-7005}
      --cluster-announce-bus-port ${PORT_REDIS_CLUSTER_BUS_6:-17005}
    ports:
      - "${PORT_REDIS_CLUSTER_6:-7005}:${PORT_REDIS_CLUSTER_6:-7005}"
      - "${PORT_REDIS_CLUSTER_BUS_6:-17005}:${PORT_REDIS_CLUSTER_BUS_6:-17005}"
    volumes:
      - redis6-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDIS_CLUSTER_IP_6:+ipv4_address: ${REDIS_CLUSTER_IP_6}}
        aliases:
            - "redis6"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "${PORT_REDIS_CLUSTER_6:-7005}", "cluster", "info"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  redis-cluster-init:
    image: redis:8.0.2
    container_name: raptor-redis-cluster-init
    profiles: ["cluster"]
    network_mode: host
    depends_on:
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
      redis3:
        condition: service_healthy
      redis4:
        condition: service_healthy
      redis5:
        condition: service_healthy
      redis6:
        condition: service_healthy
    entrypoint: [
      "/bin/sh", "-c",
      "echo 'yes' | redis-cli -a ${REDIS_PASSWORD} --cluster create ${HOST_IP}:${PORT_REDIS_CLUSTER_1:-7000} ${HOST_IP}:${PORT_REDIS_CLUSTER_2:-7001} ${HOST_IP}:${PORT_REDIS_CLUSTER_3:-7002} ${HOST_IP}:${PORT_REDIS_CLUSTER_4:-7003} ${HOST_IP}:${PORT_REDIS_CLUSTER_5:-7004} ${HOST_IP}:${PORT_REDIS_CLUSTER_6:-7005} --cluster-replicas 1"
    ]
    restart: "no"

  redisinsight:
    image: redislabs/redisinsight:2.70
    container_name: raptor-redisinsight
    hostname: raptor-redisinsight
    ports:
      - "${PORT_REDISINSIGHT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDISINSIGHT_IP:+ipv4_address: ${REDISINSIGHT_IP}}
        aliases:
            - "raptor-redisinsight"  # 定義別名
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.25'

  redis-standalone:
    image: redis:7.4-alpine
    container_name: raptor-redis-standalone
    hostname: raptor-redis-standalone
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "${PORT_REDIS_STANDALONE:-6379}:6379"
    volumes:
      - redis-standalone-data:/data
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDIS_STANDALONE_IP:+ipv4_address: ${REDIS_STANDALONE_IP}}
        aliases:
            - "raptor-redis-standalone"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.25'

volumes:
  redis1-data:
  redis2-data:
  redis3-data:
  redis4-data:
  redis5-data:
  redis6-data:
  redisinsight-data:
  redis-standalone-data:

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
