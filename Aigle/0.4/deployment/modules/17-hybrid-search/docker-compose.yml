services:
  opensearch-node1: # This is also the hostname of the container within the Docker network (i.e. https://opensearch-node1/)
    build: ./opensearch # custom image: opensearchproject/opensearch:3.4.0 + prometheus-exporter plugin
    image: raptor/opensearch-prometheus:3.4.0.0
    container_name: raptor-opensearch-node1
    environment:
      - cluster.name=opensearch-cluster # Name the cluster
      - node.name=opensearch-node1 # Name the node that will run in this container
      - discovery.seed_hosts=opensearch-node1,opensearch-node2 # Nodes to look for when discovering the cluster
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2 # Nodes eligibile to serve as cluster manager
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g" # Set min and max JVM heap sizes to at least 50% of system RAM
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD} # Sets the demo admin user password when using demo configuration (for OpenSearch 2.12 and later)
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data # Creates volume called opensearch-data1 and mounts it to the container
    ports:
      - ${PORT_OPENSEARCH:-9200}:9200 # REST API
      - ${PORT_OPENSEARCH_PERF:-9600}:9600 # Performance Analyzer
    healthcheck:
      test: ["CMD-SHELL", "curl https://localhost:9200/_cluster/health -ku '${OPENSEARCH_USER}:${OPENSEARCH_PASSWORD}' || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - "raptor-opensearch1"

  opensearch-node2:
    build: ./opensearch # must be the same image used for opensearch-node1 to avoid issues
    image: raptor/opensearch-prometheus:3.4.0.0
    container_name: raptor-opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - "raptor-opensearch2"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0 # Make sure the version of opensearch-dashboards matches the version of opensearch installed on other nodes
    container_name: raptor-opensearch-dashboards
    ports:
      - ${PORT_OPENSEARCH_DASHBOARDS:-5601}:5601 # Map host port 5601 to container port 5601
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch-node1:9200","https://opensearch-node2:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
      # - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true" # disables security dashboards plugin in OpenSearch Dashboards
      # - "OPENSEARCH_SSL_VERIFICATIONMODE=none" # Disable SSL verification for OpenSearch Dashboards to connect to OpenSearch
    depends_on:
      opensearch-node1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - "raptor-opensearch-dashboards"

  opensearch-security-init:
    image: docker:cli
    container_name: raptor-opensearch-security-init
    depends_on:
      opensearch-node1:
        condition: service_healthy
      opensearch-node2:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        echo 'Running securityadmin inside node1...'
        docker exec raptor-opensearch-node1 bash \
          /usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh \
          -cd /usr/share/opensearch/config/opensearch-security/ \
          -icl -nhnv \
          -cacert /usr/share/opensearch/config/root-ca.pem \
          -cert /usr/share/opensearch/config/kirk.pem \
          -key /usr/share/opensearch/config/kirk-key.pem \
          -h localhost
        echo 'Security initialized.'
    networks:
      raptor: {}
    restart: "no"

  api:
    build: .
    image: raptor/hybridsearch-api:0.4
    container_name: raptor-hybridsearch-api
    ports:
      - "${PORT_HYBRID_SEARCH:-8081}:8000"
    env_file:
      - .env
      - path: ../.env
        required: false
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /hf_cache
    volumes:
      - ./app:/app/app
      - ${HF_CACHE_PATH:-~/.cache/huggingface}:/hf_cache
    depends_on:
      opensearch-node1:
        condition: service_healthy
      opensearch-node2:
        condition: service_started
      opensearch-security-init:
        condition: service_completed_successfully
    networks:
      raptor:
        aliases:
          - "raptor-hybridsearch-api"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HYBRID_SEARCH_GPU:-0}"]
              capabilities: [gpu]

volumes:
  opensearch-data1:
  opensearch-data2:

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}