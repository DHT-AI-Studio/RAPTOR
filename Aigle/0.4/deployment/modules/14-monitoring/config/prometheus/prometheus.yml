# Prometheus Configuration — Raptor 0.3
# 所有 target 使用 Docker 容器名稱（network: raptor）
# 標記 [TODO] 的需先在該服務加 prometheus-fastapi-instrumentator 或對應 exporter

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'raptor-platform'
    env: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['raptor-alertmanager:9093']

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:

  # ── Prometheus 自身 ───────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Raptor Application Services ───────────────────────────────────────────

  - job_name: 'raptor-agent-protocol'       # Module 21 ✅ /metrics 已存在
    static_configs:
      - targets: ['raptor-agent-protocol:8030']
    metrics_path: /metrics

  - job_name: 'raptor-api-gateway'          # Module 13 ✅ /metrics 已存在
    static_configs:
      - targets: ['raptor-api-gateway:8012']
    metrics_path: /metrics

  - job_name: 'raptor-hybridsearch'         # Module 17 ✅ /metrics 已存在
    static_configs:
      - targets: ['raptor-hybridsearch-api:8000']
    metrics_path: /metrics

  - job_name: 'raptor-ai-lifecycle'         # Module 07 ✅ /metrics 已存在
    static_configs:
      - targets: ['raptor-ai-lifecycle-api:8010']
    metrics_path: /metrics

  - job_name: 'raptor-query-orchestrator'   # Module 18 ✅ /metrics 已存在
    static_configs:
      - targets: ['raptor-query-orchestrator:8000']
    metrics_path: /metrics

  - job_name: 'raptor-chat-service'         # Module 15 ✅ /metrics 已存在
    static_configs:
      - targets: ['raptor-chat-service:8021']
    metrics_path: /metrics

  # ── A2A Sub-agents (Module 21) ────────────────────────────────────────────
  # sub-agent 本身無 /metrics，透過 raptor-agent-protocol 的 pipeline metrics 覆蓋

  # ── Infrastructure — 已有 /metrics ───────────────────────────────────────

  - job_name: 'qdrant'                      # ✅ 內建 /metrics
    static_configs:
      - targets: ['raptor-qdrant:6333']
    metrics_path: /metrics

  - job_name: 'neo4j'                       # ✅ 內建 :2004/metrics
    static_configs:
      - targets: ['raptor-neo4j:2004']
    metrics_path: /metrics

  - job_name: 'lakefs'                      # ✅ 內建 /metrics
    static_configs:
      - targets: ['raptor-lakefs:8000']
    metrics_path: /metrics

  # ── Infrastructure — 需要額外 exporter ───────────────────────────────────

  - job_name: 'raptor-redis-exporter'        # ✅ redis-exporter 已部署 (module 14)
    static_configs:
      - targets: ['raptor-redis-exporter:9121']

  - job_name: 'kafka'                       # ✅ kafka-exporter 已部署 (module 14)
    static_configs:
      - targets: ['raptor-kafka-exporter:9308']

  # basic_auth.password_file 而非寫死密碼 -- 見 docker-compose.yml 掛載的
  # ./secrets/opensearch_password（build.py run 14 從 .env 自動產生，never in git）。
  - job_name: 'opensearch'                  # ✅ prometheus-exporter plugin 已安裝 (module 17)
    scheme: https
    tls_config:
      insecure_skip_verify: true
    basic_auth:
      username: admin
      password_file: /etc/prometheus/secrets/opensearch_password
    static_configs:
      - targets: ['raptor-opensearch-node1:9200']
    metrics_path: /_prometheus/metrics

  - job_name: 'keycloak'                    # ✅ Module 06, KC_METRICS_ENABLED=true 已預設開啟
    static_configs:
      - targets: ['raptor-keycloak:9000']
    metrics_path: /metrics

  # 與上面的 opensearch job（原生 plugin）重複，保留作第二來源
  - job_name: 'raptor-elasticsearch-exporter'
    static_configs:
      - targets: ['raptor-elasticsearch-exporter:9114']

  # GPU 主機限定 -- 只有 `docker compose --profile gpu up -d` 才會啟動，
  # 沒有 GPU 的機器上這個 target 顯示 DOWN 是預期行為。
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['raptor-dcgm-exporter:9400']
    metrics_path: /metrics
