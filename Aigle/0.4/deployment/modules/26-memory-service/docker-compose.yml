volumes:
  memvid_storage:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${NFS_MEMVID_PATH}"

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}

services:
  memory-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: raptor/memory-service:0.4
    container_name: raptor-memory-service
    restart: unless-stopped
    ports:
      - "${PORT_MEMORY_SERVICE}:8026"
    volumes:
      - ./app:/app:ro
      - memvid_storage:${MEM_STORAGE_ROOT:-/mnt/memvid-storage}
      # Same shared HF cache convention as 07/11 — LocalEmbeddings loads
      # BAAI/bge-m3 via sentence-transformers at startup, which needs a
      # writable HOME/.cache/huggingface; memsvc has no home dir at all
      # (useradd --no-create-home), so without this it fails with
      # PermissionError on /home/memsvc. Reusing HF_CACHE_PATH also means
      # a model already cached by another module's download doesn't get
      # pulled a second time.
      - ${HF_CACHE_PATH:-~/.cache/huggingface}:/hf_cache
    env_file:
      - .env
      - path: ../.env
        required: false
    environment:
      MEM_STORAGE_ROOT: ${MEM_STORAGE_ROOT:-/mnt/memvid-storage}
      MEM_EMBEDDING_MODEL: ${MEM_EMBEDDING_MODEL:-BAAI/bge-m3}
      # Extraction/compaction LLM (preference/entity/fact extraction, compact_session's
      # summarization) -- was never wired here at all, silently relying on config.py's
      # hardcoded "qwen2.5:7b" default no matter what LLM_MODEL was set to elsewhere.
      MEM_EXTRACTION_MODEL: ${MEM_EXTRACTION_MODEL:-qwen2.5:7b}
      MEM_MODULE07_URL: ${MODULE07_URL:-http://raptor-ai-lifecycle-api:8010}
      MEM_INFERENCE_THINK: ${MEM_INFERENCE_THINK:-false}
      MEM_REDIS_HOST: ${REDIS_HOST:-raptor-redis-standalone}
      MEM_REDIS_PORT: ${REDIS_PORT:-6379}
      MEM_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      HF_HOME: /hf_cache
      CUDA_VISIBLE_DEVICES: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8026/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      raptor:
        aliases:
          - "raptor-memory"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MEMORY_SERVICE_GPU:-0}"]
              capabilities: [gpu]
