# Authentication Module (Keycloak)
# Aigle Platform v0.4
# Deploy: docker-compose -f docker-compose.yml up -d

services:
  # Keycloak Database
  keycloak-db:
    image: postgres:15
    container_name: raptor-keycloak-db
    hostname: raptor-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_DATABASE:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: ${TIMEZONE:-Asia/Taipei}
    ports:
      - "${PORT_KEYCLOAK_DB:-5434}:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      raptor:
        aliases:
          - keycloak-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # Keycloak Identity Server
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: raptor-keycloak
    hostname: raptor-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      PERMANENT_MASTER_ADMIN_USER: ${PERMANENT_MASTER_ADMIN_USER}
      PERMANENT_ADMIN_PASSWORD: ${PERMANENT_ADMIN_PASSWORD}
      KC_HOSTNAME: ${HOST_IP:-localhost}
      TZ: ${TIMEZONE:-Asia/Taipei}
    ports:
      - "${PORT_KEYCLOAK:-8080}:8080"
    volumes:
      - ./realm-import:/opt/keycloak/data/import:ro
      - ./create-permanent-admin.sh:/opt/keycloak/bin/create-permanent-admin.sh:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      raptor:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: raptor-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/keycloak/bin/create-permanent-admin.sh"]
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PERMANENT_MASTER_ADMIN_USER: ${PERMANENT_MASTER_ADMIN_USER}
      PERMANENT_ADMIN_PASSWORD: ${PERMANENT_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME:-DHT Solution}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - ./create-permanent-admin.sh:/opt/keycloak/bin/create-permanent-admin.sh:ro
    networks:
      - raptor
    restart: "no"

  keycloak-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: raptor/keycloak-api:0.4
    container_name: raptor-keycloak-api
    hostname: raptor-keycloak-api
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dhtsolution}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-raptor}
      KEYCLOAK_INFERENCE_URIS: ${KEYCLOAK_INFERENCE_URIS:-}
      KEYCLOAK_FINETUNING_URIS: ${KEYCLOAK_FINETUNING_URIS:-}
      PERMANENT_MASTER_ADMIN_USER: ${PERMANENT_MASTER_ADMIN_USER}
      PERMANENT_ADMIN_PASSWORD: ${PERMANENT_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO_EMAIL: ${SMTP_TO_EMAIL:-}
      TZ: ${TIMEZONE:-Asia/Taipei}
    ports:
      - "${PORT_KEYCLOAK_API:-8800}:8800"
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    networks:
      raptor:
        aliases:
          - keycloak-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

volumes:
  keycloak-db-data:

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
