# =============================================================================
# Raptor Platform — Canonical Service Catalog
# =============================================================================
# Single source of truth for all module identities, ports, API paths, and
# ownership. Every docker-compose, plan document, and CI script MUST reference
# this file instead of hard-coding values.
#
# Schema per entry:
#   id            – module number (matches deployment/modules/NN-* directory)
#   name          – human-readable service name
#   container     – container_name prefix (without -${RAPTOR_VERSION} suffix)
#   internal_port – port the process listens on INSIDE the container
#   public_port   – host-side default (PORT_* env var default); null = not published
#   public_port_env – the .env variable that controls the host port
#   base_path     – canonical HTTP base path (null for pure-infra / non-HTTP)
#   alt_paths     – other mounted paths on the same container
#   proto         – transport protocol(s): http | grpc | both
#   auth          – keycloak_jwt | internal | none
#   health        – health-check endpoint (HTTP) or null
#   planned       – true = v0.5 target, not yet deployed
#   owner         – team responsible
#   notes         – conflict resolutions and important caveats
# =============================================================================

