services:
  app:
    build: .
    image: raptor/asset-management:${RAPTOR_VERSION}
    container_name: raptor-asset-management-${RAPTOR_VERSION}
    ports:
      - "${PORT_ASSET_MANAGEMENT:-8000}:8000"
    env_file:
      - .env
      - path: ../.env
        required: false
    environment:
      - TZ=${TIMEZONE}
      - POSTGRES_DB=asset_management
      # GD-1 / VIE01-246: shared secret Module 33 presents as X-Internal-Token
      # on DELETE /internal/gdpr/user/{user_id}. Set explicitly here (not just
      # via env_file: .env) since env_file: doesn't expand ${VAR} syntax --
      # this keeps GD_INTERNAL_TOKEN as the single source of truth.
      - GDPR_INTERNAL_TOKEN=${GD_INTERNAL_TOKEN:-}
      # MTR-7 / VIE01-306: internal-only URL for the GPU-isolated thumbnail
      # worker below -- this container itself has no GPU access and never
      # runs ffmpeg/NVDEC directly.
      - THUMBNAIL_WORKER_URL=http://thumbnail-worker:8034
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-asset-management
    volumes:
      - ./asset_management:/app/asset_management:ro
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
      lakefs-setup:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MTR-7 / VIE01-306: GPU-only thumbnail extraction, isolated from the main
  # `app` service above -- same split module 11 (video-processing) uses
  # between its GPU-needing stages (video-chunking, video-ocr-frame,
  # video-frame-description) and its CPU-only ones. "not blanket Module 04"
  # means exactly this: only this one container gets GPU/CUDA access, not
  # the whole asset-management service.
  thumbnail-worker:
    build: ./thumbnail_worker
    image: raptor/thumbnail-worker:${RAPTOR_VERSION}
    container_name: raptor-thumbnail-worker-${RAPTOR_VERSION}
    hostname: raptor-thumbnail-worker
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-thumbnail-worker
    # Lighter equivalent of module 11's `import torch` healthcheck -- this
    # worker has no PyTorch, just ffmpeg, so nvidia-smi is the direct
    # CUDA/driver-availability probe.
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi > /dev/null 2>&1"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${THUMBNAIL_GPU:-0}"]
              capabilities: [gpu]

  seaweedfs-master1:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-master1-${RAPTOR_VERSION}
    command: master -port=9333 -port.grpc=19333 -mdir=/data/master1 -volumeSizeLimitMB=${VOLUME_SIZE_LIMIT_MB} \
     -ip=seaweedfs-master1 -ip.bind=0.0.0.0 \
     -defaultReplication=000 -metricsPort=1234 \
     -peers=seaweedfs-master2:9334,seaweedfs-master3:9335
    volumes:
      - seaweedfs_master1:/data/master1
      - ./docker_compose_settings/seaweedfs/master.toml:/etc/seaweedfs/master.toml
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-master1

  seaweedfs-master2:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-master2-${RAPTOR_VERSION}
    command: master -port=9334 -port.grpc=19334 -mdir=/data/master2 -volumeSizeLimitMB=${VOLUME_SIZE_LIMIT_MB} \
     -ip=seaweedfs-master2 -ip.bind=0.0.0.0 \
     -defaultReplication=000 -metricsPort=1235 \
     -peers=seaweedfs-master1:9333,seaweedfs-master3:9335
    volumes:
      - seaweedfs_master2:/data/master2
      - ./docker_compose_settings/seaweedfs/master.toml:/etc/seaweedfs/master.toml
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-master2

  seaweedfs-master3:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-master3-${RAPTOR_VERSION}
    command: master -port=9335 -port.grpc=19335 -mdir=/data/master3 -volumeSizeLimitMB=${VOLUME_SIZE_LIMIT_MB} \
     -ip=seaweedfs-master3 -ip.bind=0.0.0.0 \
     -defaultReplication=000 -metricsPort=1236 \
     -peers=seaweedfs-master1:9333,seaweedfs-master2:9334
    volumes:
      - seaweedfs_master3:/data/master3
      - ./docker_compose_settings/seaweedfs/master.toml:/etc/seaweedfs/master.toml
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-master3

  seaweedfs-volume1:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-volume1-${RAPTOR_VERSION}
    command: volume -dir=/data/vol1 -mserver=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 \
     -port=8081 -port.grpc=18081 -max=${MAX_NUMBER_OF_VOLUMES} -ip=seaweedfs-volume1 \
     -ip.bind=0.0.0.0 -dataCenter=dc1 -rack=rack1 -metricsPort=1237
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
    volumes:
      - seaweedfs_vol1:/data/vol1
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-volume1

  seaweedfs-volume2:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-volume2-${RAPTOR_VERSION}
    command: volume -dir=/data/vol2 -mserver=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 \
     -port=8082 -port.grpc=18082 -max=${MAX_NUMBER_OF_VOLUMES} -ip=seaweedfs-volume2 \
     -ip.bind=0.0.0.0 -dataCenter=dc1 -rack=rack1 -metricsPort=1238
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
    volumes:
      - seaweedfs_vol2:/data/vol2
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-volume2

  seaweedfs-volume3:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-volume3-${RAPTOR_VERSION}
    command: volume -dir=/data/vol3 -mserver=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 \
     -port=8083 -port.grpc=18083 -max=${MAX_NUMBER_OF_VOLUMES} -ip=seaweedfs-volume3 \
     -ip.bind=0.0.0.0 -dataCenter=dc1 -rack=rack2 -metricsPort=1239
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
    volumes:
      - seaweedfs_vol3:/data/vol3
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-volume3

  seaweedfs-volume4:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-volume4-${RAPTOR_VERSION}
    command: volume -dir=/data/vol4 -mserver=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 \
     -port=8084 -port.grpc=18084 -max=${MAX_NUMBER_OF_VOLUMES} -ip=seaweedfs-volume4 \
     -ip.bind=0.0.0.0 -dataCenter=dc1 -rack=rack2 -metricsPort=1240
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
    volumes:
      - seaweedfs_vol4:/data/vol4
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-volume4

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-filer-${RAPTOR_VERSION}
    env_file:
      - .env
      - path: ../.env
        required: false
    entrypoint: ["sh", "/etc/seaweedfs/filer-entrypoint.sh"]
    volumes:
      - seaweedfs_filer:/data/filer
      - ./docker_compose_settings/seaweedfs/filer_generated.toml:/etc/seaweedfs/filer_generated.toml
      - ./docker_compose_settings/seaweedfs/filer-entrypoint.sh:/etc/seaweedfs/filer-entrypoint.sh
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-filer
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-s3-${RAPTOR_VERSION}
    ports:
      - "${PORT_SEAWEEDFS_S3:-8333}:8333"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY}
    command: s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333 -port.grpc=18333 -allowEmptyFolder=true -metricsPort=1242
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    volumes:
      - seaweedfs_s3:/data/s3
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-s3
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8333 2>&1 | grep -q '403 Forbidden' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-admin-${RAPTOR_VERSION}
    ports:
      - "${PORT_SEAWEEDFS_ADMIN:-23646}:23646"
    command: admin -masters=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 \
     -dataDir=/data/admin -port=23646
    depends_on:
      - seaweedfs-filer
    volumes:
      - seaweedfs_admin:/data/admin
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-admin

  seaweedfs-worker1:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-worker1-${RAPTOR_VERSION}
    command: worker -admin=seaweedfs-admin:23646 -jobType=vacuum,volume_balance,erasure_coding -heartbeat=30s
    depends_on:
      - seaweedfs-admin
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-worker1

  seaweedfs-backup:
    image: chrislusf/seaweedfs:4.32
    container_name: raptor-seaweedfs-backup-${RAPTOR_VERSION}
    command: filer.backup -filer=seaweedfs-filer:8888
    volumes:
      - ./docker_compose_settings/seaweedfs/replication.toml:/etc/seaweedfs/replication.toml:ro
      - seaweedfs_backup:/backup
    depends_on:
      - seaweedfs-filer
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-seaweedfs-backup

  lakefs:
    image: treeverse/lakefs:1.65.2
    container_name: raptor-lakefs-${RAPTOR_VERSION}
    ports:
      - "${PORT_LAKEFS:-8001}:8000"
    environment:
      - LAKEFS_DATABASE_TYPE=postgres
      - LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/asset_management?sslmode=disable
      - LAKEFS_BLOCKSTORE_TYPE=s3
      - LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE=true
      - LAKEFS_BLOCKSTORE_S3_ENDPOINT=${S3_ENDPOINT}
      - LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION=false
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID=${AWS_ACCESS_KEY}
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY}
      - LAKECTL_CREDENTIALS_ACCESS_KEY_ID=${LAKEFS_ACCESS_KEY}
      - LAKECTL_CREDENTIALS_SECRET_ACCESS_KEY=${LAKEFS_SECRET_KEY}
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}
      - LAKEFS_BLOCKSTORE_S3_REGION="none"
      - LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT=${S3_PUBLIC_URL}
      - LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_EXPIRY=${LAKEFS_PRE_SIGNED_EXPIRY}
      - TZ=${TIMEZONE}
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    volumes:
      - lakefs_data:/home/lakefs
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-lakefs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  lakefs-setup:
    image: curlimages/curl:8.17.0
    container_name: raptor-lakefs-setup-${RAPTOR_VERSION}
    depends_on:
      lakefs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting lakeFS setup..."
        curl -X POST "http://lakefs:8000/api/v1/setup_lakefs" \
             -H "accept: application/json" \
             -H "Content-Type: application/json" \
             -d '{
               "username": "admin",
               "key": {
                 "access_key_id": "${LAKEFS_ACCESS_KEY}",
                 "secret_access_key": "${LAKEFS_SECRET_KEY}"
               }
             }' && echo "Setup successful or already completed." || echo "Setup skipped."
    networks:
      raptor:
        aliases:
          - raptor-lakefs-setup

volumes:
  app:
  lakefs_data:

  seaweedfs_master1:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/master1"

  seaweedfs_master2:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/master2"

  seaweedfs_master3:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/master3"

  seaweedfs_vol1:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/vol1"

  seaweedfs_vol2:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/vol2"

  seaweedfs_vol3:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/vol3"

  seaweedfs_vol4:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/vol4"

  seaweedfs_filer:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/filer"

  seaweedfs_s3:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/s3"

  seaweedfs_admin:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/admin"

  seaweedfs_backup:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${SEAWEEDFS_BASE_DIR}/backup"

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
