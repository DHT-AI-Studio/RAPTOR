# Video Processing Module
# Raptor Platform v0.3
# WORKER_TYPE selects the service.
# GPU required for: video-frame-description (InternVL 3.5-4B), video-ocr-frame (PaddleOCR),
#                   video-face-detection (InsightFace ONNX).
# Deploy: docker compose -f docker-compose.yml up -d

x-worker-common: &worker-common
  image: raptor/media-worker:${RAPTOR_VERSION}
  environment: &worker-env
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092}
    REDIS_HOST: ${REDIS_HOST:-raptor-redis-standalone}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    INFERENCE_URL: ${INFERENCE_URL:-http://raptor-ai-lifecycle-api:8010}
    INFERENCE_MODEL: ${VIDEO_INFERENCE_MODEL:-gemma4:12b}
    INFERENCE_THINK: ${VIDEO_INFERENCE_THINK:-false}
    VIDEO_NORMALIZE_TIMEOUT_SEC: ${VIDEO_NORMALIZE_TIMEOUT_SEC:-600}
    HYBRID_SEARCH_INGEST_URL: ${HYBRID_SEARCH_INGEST_URL:-http://raptor-hybridsearch-api:8000/api/v1/ingest/file}
    HF_TOKEN: ${HF_TOKEN}
    HF_HOME: /hf_cache
    TZ: ${TIMEZONE:-Asia/Taipei}
  volumes: &worker-volumes
    - ${HF_CACHE_PATH:-~/.cache/huggingface}:/hf_cache
    - media-tmp:/tmp/media_processing
  restart: unless-stopped
  networks:
    - raptor

services:
  video-kafka-init-topics:
    image: confluentinc/cp-kafka:7.9.0
    container_name: raptor-video-kafka-init-${RAPTOR_VERSION}
    networks:
      raptor:
        aliases:
          - raptor-video-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092}
    entrypoint: >
      /bin/bash -c "
        BS=$$(echo $$KAFKA_BOOTSTRAP_SERVERS | cut -d',' -f1);
        echo \"Waiting for Kafka at $$BS...\";
        until kafka-topics --bootstrap-server $$BS --list > /dev/null 2>&1; do
          sleep 5;
        done;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-processing-requests --partitions 12 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-processing-results --partitions 12 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-analysis-requests --partitions 12 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-analysis-results --partitions 12 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-chunking-requests --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-chunking-results --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-ocr-frame-requests --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-ocr-frame-results --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-frame-description-requests --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-frame-description-results --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-face-detection-requests --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-face-detection-results --partitions 9 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-summary-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-summary-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-contextualize-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-contextualize-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-indexer-requests --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-indexer-results --partitions 6 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-processing-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-analysis-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-chunking-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-ocr-frame-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-frame-description-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-summary-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-contextualize-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-indexer-dlq --partitions 1 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-graph-ingest-results --partitions 3 --replication-factor 3;
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic video-graph-ingest-dlq --partitions 1 --replication-factor 3;
        echo 'Video topics ready.';
      "
    restart: "no"

  video-orchestrator:
    <<: *worker-common
    container_name: raptor-video-orchestrator-${RAPTOR_VERSION}
    hostname: raptor-video-orchestrator
    depends_on:
      video-kafka-init-topics:
        condition: service_completed_successfully
    environment:
      <<: *worker-env
      WORKER_TYPE: video_orchestrator
      ASSET_MANAGEMENT_URL: ${ASSET_MANAGEMENT_URL:-http://raptor-asset-management:8000}
      FACE_DETECTION_ENABLED: ${FACE_DETECTION_ENABLED:-true}
    networks:
      raptor:
        aliases:
          - raptor-video-orchestrator
    deploy:
      resources:
        limits:
          memory: ${VIDEO_ORCHESTRATOR_MEMORY_LIMIT:-2g}
          cpus: '${VIDEO_ORCHESTRATOR_CPU_LIMIT:-1}'

  video-chunking:
    <<: *worker-common
    container_name: raptor-video-chunking-${RAPTOR_VERSION}
    hostname: raptor-video-chunking
    environment:
      <<: *worker-env
      WORKER_TYPE: video_chunking
      CUDA_VISIBLE_DEVICES: "0"
      # CM-3 keyframe moderation (Module 23 image guard), off by default -- see
      # worker/services/video_chunking_service/video_moderation.py.
      VIDEO_MODERATION_ENABLED: ${VIDEO_MODERATION_ENABLED:-false}
      VIDEO_MODERATION_MODEL: ${VIDEO_MODERATION_MODEL:-shieldgemma-2}
      VIDEO_MODERATION_SAMPLE_EVERY_SEC: ${VIDEO_MODERATION_SAMPLE_EVERY_SEC:-2}
      VIDEO_MODERATION_SCENE_CUTS: ${VIDEO_MODERATION_SCENE_CUTS:-true}
      VIDEO_MODERATION_SCENE_THRESHOLD: ${VIDEO_MODERATION_SCENE_THRESHOLD:-0.3}
      VIDEO_MODERATION_MAX_CUTS_PER_MOMENT: ${VIDEO_MODERATION_MAX_CUTS_PER_MOMENT:-5}
      VIDEO_MODERATION_SKIP_DUPLICATES: ${VIDEO_MODERATION_SKIP_DUPLICATES:-true}
      VIDEO_MODERATION_DUPLICATE_MAX_CHANGE: ${VIDEO_MODERATION_DUPLICATE_MAX_CHANGE:-0.005}
      VIDEO_MODERATION_CONCURRENCY: ${VIDEO_MODERATION_CONCURRENCY:-2}
      VIDEO_MODERATION_TIMEOUT: ${VIDEO_MODERATION_TIMEOUT:-180}
      VIDEO_MODERATION_FAIL_MODE: ${VIDEO_MODERATION_FAIL_MODE:-open}
      GUARDRAIL_URL: ${GUARDRAIL_URL:-http://raptor-guardrail-service:8026}
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
    # Marks the container "unhealthy" when CUDA/NVML goes stale after extended
    # uptime. The `video-gpu-watchdog` sidecar (below) restarts it on that signal.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import torch; exit(0 if torch.cuda.is_available() else 1)' 2>/dev/null"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 120s
    networks:
      raptor:
        aliases:
          - raptor-video-chunking
    deploy:
      resources:
        limits:
          memory: ${VIDEO_CHUNKING_MEMORY_LIMIT:-4g}
          cpus: '${VIDEO_CHUNKING_CPU_LIMIT:-2}'
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VIDEO_CHUNKING_GPU:-0}"]
              capabilities: [gpu]

  video-analysis:
    <<: *worker-common
    container_name: raptor-video-analysis-${RAPTOR_VERSION}
    hostname: raptor-video-analysis
    environment:
      <<: *worker-env
      WORKER_TYPE: video_analysis
    networks:
      raptor:
        aliases:
          - raptor-video-analysis
    deploy:
      resources:
        limits:
          memory: ${VIDEO_ANALYSIS_MEMORY_LIMIT:-4g}
          cpus: '${VIDEO_ANALYSIS_CPU_LIMIT:-2}'

  video-ocr-frame:
    <<: *worker-common
    container_name: raptor-video-ocr-frame-${RAPTOR_VERSION}
    hostname: raptor-video-ocr-frame
    environment:
      <<: *worker-env
      WORKER_TYPE: video_ocr_frame
      CUDA_VISIBLE_DEVICES: "0"
      OCR_DET_MODEL: ${OCR_DET_MODEL:-PP-OCRv5_mobile_det}
      OCR_REC_MODEL: ${OCR_REC_MODEL:-PP-OCRv5_mobile_rec}
      OCR_PRECISION: ${OCR_PRECISION:-fp16}
    ports:
      - "${PORT_VIDEO_OCR_SYNC:-8032}:8032"
    # Marks the container "unhealthy" when CUDA/NVML goes stale after extended
    # uptime. The `video-gpu-watchdog` sidecar (below) restarts it on that signal.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import torch; exit(0 if torch.cuda.is_available() else 1)' 2>/dev/null"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 120s
    networks:
      raptor:
        aliases:
          - raptor-video-ocr-frame
    deploy:
      resources:
        limits:
          memory: ${VIDEO_OCR_MEMORY_LIMIT:-8g}
          cpus: '${VIDEO_OCR_CPU_LIMIT:-2}'
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VIDEO_OCR_GPU:-0}"]
              capabilities: [gpu]

  # Face detection (dev plan v1.4 §4.3 / §4.5): RetinaFace MobileNetV2 (MIT) + AuraFace (Apache 2.0).
  # Kafka consumer for the orchestrator's third parallel branch (not part of its completion condition)
  # plus the sync /embed-face API, sharing one resident ONNX session.
  # Needs the media-worker image built with insightface + onnxruntime-gpu (08-media-worker Dockerfile).
  # ONNX models are not baked into the image: on first start the service downloads them into the
  # shared model cache volume (/hf_cache/face) and checks their SHA-256; later starts reuse them.
  video-face-detection:
    <<: *worker-common
    container_name: raptor-video-face-detection-${RAPTOR_VERSION}
    hostname: raptor-video-face-detection
    environment:
      <<: *worker-env
      WORKER_TYPE: video_face_detection
      CUDA_VISIBLE_DEVICES: "0"
      ASSET_MANAGEMENT_URL: ${ASSET_MANAGEMENT_URL:-http://raptor-asset-management:8000}
      PERSONAL_DB_SERVICE_URL: ${PERSONAL_DB_SERVICE_URL:-http://raptor-personal-db-service:8000}
      # GD-11: face detection runs only for users with face_detection consent (Module 33 GET /consent).
      PRIVACY_COMPLIANCE_URL: ${PRIVACY_COMPLIANCE_URL:-http://raptor-privacy-compliance-service:8033}
      GD_INTERNAL_TOKEN: ${GD_INTERNAL_TOKEN:-}
      FACE_MODEL_DIR: /hf_cache/face
      FACE_DET_THRESHOLD: ${FACE_DET_THRESHOLD:-0.5}
      FACE_MIN_SIZE_PX: ${FACE_MIN_SIZE_PX:-20}
      FACE_SHOT_THRESHOLD: ${FACE_SHOT_THRESHOLD:-27.0}
    volumes:
      - ${HF_CACHE_PATH:-~/.cache/huggingface}:/hf_cache
      - media-tmp:/tmp/media_processing
    ports:
      - "${PORT_VIDEO_FACE_SYNC:-8033}:8033"
    # Marks the container "unhealthy" when CUDA/NVML goes stale after extended
    # uptime. The `video-gpu-watchdog` sidecar (below) restarts it on that signal.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import torch; exit(0 if torch.cuda.is_available() else 1)' 2>/dev/null"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 120s
    networks:
      raptor:
        aliases:
          - raptor-video-face-detection
    deploy:
      resources:
        limits:
          memory: ${VIDEO_FACE_MEMORY_LIMIT:-6g}
          cpus: '${VIDEO_FACE_CPU_LIMIT:-2}'
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VIDEO_FACE_GPU:-0}"]
              capabilities: [gpu]

  video-frame-description:
    <<: *worker-common
    container_name: raptor-video-frame-description-${RAPTOR_VERSION}
    hostname: raptor-video-frame-description
    environment:
      <<: *worker-env
      WORKER_TYPE: video_frame_description
      CUDA_VISIBLE_DEVICES: "0"
      VLM_MODEL_PATH: ${VIDEO_VLM_MODEL_PATH:-OpenGVLab/InternVL3_5-4B}
      VLM_MODEL_REVISION: ${VIDEO_VLM_MODEL_REVISION:-481f6e32467eab4e922ccd7fd6cf420441a62331}
      MAX_MEMORY_PER_GPU: ${MAX_MEMORY_PER_GPU:-36GiB}
      VIDEO_OCR_SYNC_URL: http://raptor-video-ocr-frame:8032
      AUDIO_SYNC_URL: ${AUDIO_SYNC_URL:-http://raptor-audio-recognizer:8019}
      CROSS_SERVICE_TIMEOUT: ${CROSS_SERVICE_TIMEOUT:-600}
      SUMMARY_MAX_TOKENS: ${SUMMARY_MAX_TOKENS:-4000}
      SUMMARY_MAX_LENGTH: ${SUMMARY_MAX_LENGTH:-300}
    ports:
      - "${PORT_VIDEO_FRAME_SYNC_API:-8031}:8031"
    # Marks the container "unhealthy" when CUDA/NVML goes stale after extended
    # uptime. The `video-gpu-watchdog` sidecar (below) restarts it on that signal.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import torch; exit(0 if torch.cuda.is_available() else 1)' 2>/dev/null"]
      interval: 60s
      timeout: 40s
      retries: 3
      start_period: 120s
    networks:
      raptor:
        aliases:
          - raptor-video-frame-description
    deploy:
      resources:
        limits:
          memory: ${VIDEO_FRAME_DESC_MEMORY_LIMIT:-20g}
          cpus: '${VIDEO_FRAME_DESC_CPU_LIMIT:-4}'
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VIDEO_FRAME_DESC_GPU:-2}"]
              capabilities: [gpu]

  video-summary:
    <<: *worker-common
    container_name: raptor-video-summary-${RAPTOR_VERSION}
    hostname: raptor-video-summary
    environment:
      <<: *worker-env
      WORKER_TYPE: video_summary
      SUMMARY_MAX_TOKENS: ${SUMMARY_MAX_TOKENS:-4000}
      SUMMARY_MAX_LENGTH: ${SUMMARY_MAX_LENGTH:-300}
    networks:
      raptor:
        aliases:
          - raptor-video-summary
    deploy:
      resources:
        limits:
          memory: ${VIDEO_SUMMARY_MEMORY_LIMIT:-4g}
          cpus: '${VIDEO_SUMMARY_CPU_LIMIT:-2}'

  video-contextualize:
    <<: *worker-common
    container_name: raptor-video-contextualize-${RAPTOR_VERSION}
    hostname: raptor-video-contextualize
    environment:
      <<: *worker-env
      WORKER_TYPE: video_contextualize
      CONTEXTUALIZE_MODEL_NAME: ${CONTEXTUALIZE_MODEL_NAME:-}
    networks:
      raptor:
        aliases:
          - raptor-video-contextualize
    deploy:
      resources:
        limits:
          memory: ${VIDEO_CONTEXTUALIZE_MEMORY_LIMIT:-2g}
          cpus: '${VIDEO_CONTEXTUALIZE_CPU_LIMIT:-1}'

  video-indexer:
    <<: *worker-common
    container_name: raptor-video-indexer-${RAPTOR_VERSION}
    hostname: raptor-video-indexer
    environment:
      <<: *worker-env
      WORKER_TYPE: video_indexer
      DEBUG_DUMP_PAYLOAD: ${DEBUG_DUMP_PAYLOAD:-false}
    networks:
      raptor:
        aliases:
          - raptor-video-indexer
    deploy:
      resources:
        limits:
          memory: ${VIDEO_INDEXER_MEMORY_LIMIT:-2g}
          cpus: '${VIDEO_INDEXER_CPU_LIMIT:-1}'

  video-graph:
    <<: *worker-common
    container_name: raptor-video-graph-${RAPTOR_VERSION}
    hostname: raptor-video-graph
    environment:
      <<: *worker-env
      WORKER_TYPE: video_graph
      GRAPH_SERVICE_URL: ${GRAPH_SERVICE_URL:-http://raptor-graph-service:8843}
    networks:
      raptor:
        aliases:
          - raptor-video-graph
    deploy:
      resources:
        limits:
          memory: ${VIDEO_GRAPH_MEMORY_LIMIT:-512m}
          cpus: '${VIDEO_GRAPH_CPU_LIMIT:-0.5}'

  video-cleanup:
    image: busybox:1.36.1
    container_name: raptor-video-cleanup-${RAPTOR_VERSION}
    volumes:
      - media-tmp:/tmp/media_processing
    command:
      - sh
      - -c
      - |
        while true; do
          find /tmp/media_processing/video_processing -mindepth 2 -maxdepth 2 -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
          find /tmp/media_processing/video_chunking -mindepth 1 -maxdepth 1 -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
          sleep 3600
        done
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - raptor-video-cleanup

  # GPU watchdog (sidecar) — restarts this module's GPU workers when their
  # healthcheck (torch.cuda.is_available) reports "unhealthy" after CUDA/NVML
  # goes stale on long-running hosts. Scoped to this module only so it starts/
  # stops with it and works whether or not modules 09/10/12 are deployed on
  # this host. Pattern ported from module 16's training-watchdog sidecar.
  # NOTE: mounting docker.sock grants this container root-equivalent host
  # control — it is intentionally minimal and only inspects/restarts.
  video-gpu-watchdog:
    image: docker:cli
    container_name: raptor-video-gpu-watchdog-${RAPTOR_VERSION}
    restart: unless-stopped
    environment:
      # Must match the real container_name (not the network alias): used for
      # `docker inspect`/`docker restart`, which address by daemon-wide name.
      - WATCH_CONTAINERS=raptor-video-chunking-${RAPTOR_VERSION},raptor-video-ocr-frame-${RAPTOR_VERSION},raptor-video-frame-description-${RAPTOR_VERSION},raptor-video-face-detection-${RAPTOR_VERSION}
      - CHECK_INTERVAL=30
      - RECOVER_COOLDOWN=90
      - TZ=${TIMEZONE:-Asia/Taipei}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nvidia-gpu-watchdog.sh:/watchdog.sh:ro
    entrypoint: ["/bin/sh", "/watchdog.sh"]
    networks:
      raptor:
        aliases:
          - raptor-video-gpu-watchdog

volumes:
  hf_cache: {}
  media-tmp:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${NFS_MEDIA_TMP_PATH}"

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
