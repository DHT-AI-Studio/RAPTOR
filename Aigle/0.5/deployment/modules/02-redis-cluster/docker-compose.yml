  redis4:
    image: redis:8.0.2
    container_name: raptor-redis4-${RAPTOR_VERSION}
    hostname: raptor-redis4
    profiles: ["cluster"]
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port ${PORT_REDIS_CLUSTER_4:-7003}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-announce-ip ${HOST_IP}
      --cluster-announce-port ${PORT_REDIS_CLUSTER_4:-7003}
      --cluster-announce-bus-port ${PORT_REDIS_CLUSTER_BUS_4:-17003}
    ports:
      - "${PORT_REDIS_CLUSTER_4:-7003}:${PORT_REDIS_CLUSTER_4:-7003}"
      - "${PORT_REDIS_CLUSTER_BUS_4:-17003}:${PORT_REDIS_CLUSTER_BUS_4:-17003}"
    volumes:
      - redis4-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDIS_CLUSTER_IP_4:+ipv4_address: ${REDIS_CLUSTER_IP_4}}
        aliases:
            - "raptor-redis4"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "${PORT_REDIS_CLUSTER_4:-7003}", "cluster", "info"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  redis5:
    image: redis:8.0.2
    container_name: raptor-redis5-${RAPTOR_VERSION}
    hostname: raptor-redis5
    profiles: ["cluster"]
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port ${PORT_REDIS_CLUSTER_5:-7004}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-announce-ip ${HOST_IP}
      --cluster-announce-port ${PORT_REDIS_CLUSTER_5:-7004}
      --cluster-announce-bus-port ${PORT_REDIS_CLUSTER_BUS_5:-17004}
    ports:
      - "${PORT_REDIS_CLUSTER_5:-7004}:${PORT_REDIS_CLUSTER_5:-7004}"
      - "${PORT_REDIS_CLUSTER_BUS_5:-17004}:${PORT_REDIS_CLUSTER_BUS_5:-17004}"
    volumes:
      - redis5-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDIS_CLUSTER_IP_5:+ipv4_address: ${REDIS_CLUSTER_IP_5}}
        aliases:
            - "raptor-redis5"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "${PORT_REDIS_CLUSTER_5:-7004}", "cluster", "info"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  redis6:
    image: redis:8.0.2
    container_name: raptor-redis6-${RAPTOR_VERSION}
    hostname: raptor-redis6
    profiles: ["cluster"]
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port ${PORT_REDIS_CLUSTER_6:-7005}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-announce-ip ${HOST_IP}
      --cluster-announce-port ${PORT_REDIS_CLUSTER_6:-7005}
      --cluster-announce-bus-port ${PORT_REDIS_CLUSTER_BUS_6:-17005}
    ports:
      - "${PORT_REDIS_CLUSTER_6:-7005}:${PORT_REDIS_CLUSTER_6:-7005}"
      - "${PORT_REDIS_CLUSTER_BUS_6:-17005}:${PORT_REDIS_CLUSTER_BUS_6:-17005}"
    volumes:
      - redis6-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDIS_CLUSTER_IP_6:+ipv4_address: ${REDIS_CLUSTER_IP_6}}
        aliases:
            - "raptor-redis6"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "${PORT_REDIS_CLUSTER_6:-7005}", "cluster", "info"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  redis-cluster-init:
    image: redis:8.0.2
    container_name: raptor-redis-cluster-init-${RAPTOR_VERSION}
    profiles: ["cluster"]
    network_mode: host
    depends_on:
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
      redis3:
        condition: service_healthy
      redis4:
        condition: service_healthy
      redis5:
        condition: service_healthy
      redis6:
        condition: service_healthy
    entrypoint: [
      "/bin/sh", "-c",
      "echo 'yes' | redis-cli -a ${REDIS_PASSWORD} --cluster create ${HOST_IP}:${PORT_REDIS_CLUSTER_1:-7000} ${HOST_IP}:${PORT_REDIS_CLUSTER_2:-7001} ${HOST_IP}:${PORT_REDIS_CLUSTER_3:-7002} ${HOST_IP}:${PORT_REDIS_CLUSTER_4:-7003} ${HOST_IP}:${PORT_REDIS_CLUSTER_5:-7004} ${HOST_IP}:${PORT_REDIS_CLUSTER_6:-7005} --cluster-replicas 1"
    ]
    restart: "no"

  redisinsight:
    image: redislabs/redisinsight:2.70
    container_name: raptor-redisinsight-${RAPTOR_VERSION}
    hostname: raptor-redisinsight
    ports:
      - "${PORT_REDISINSIGHT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        # ${REDISINSIGHT_IP:+ipv4_address: ${REDISINSIGHT_IP}}
        aliases:
            - "raptor-redisinsight"  # 定義別名
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.25'

  redis-standalone:
    image: redis:7.4-alpine
    container_name: raptor-redis-standalone-${RAPTOR_VERSION}
    hostname: raptor-redis-standalone
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "${PORT_REDIS_STANDALONE:-6379}:6379"
    volumes:
      - redis-standalone-data:/data
      - redis-standalone-backup-staging:/backup-staging
    # VIE01-369 Phase 1: `--rdb` triggers a synchronous, consistent RDB
    # snapshot over the replication protocol (no BGSAVE-in-progress poll
    # needed) -- see docs/backup-restore-v0.5.md.
    labels:
      # exec-label: confirmed live (module 24), without this every sidecar's
      # `backup` run triggers archive-pre on every labeled container
      # reachable via the shared docker.sock, not just its own target.
      - "docker-volume-backup.exec-label=02-redis-standalone"
      - "docker-volume-backup.archive-pre=sh -c 'redis-cli -a $$REDIS_PASSWORD --rdb /backup-staging/redis-standalone.rdb'"
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      raptor:
        # ${REDIS_STANDALONE_IP:+ipv4_address: ${REDIS_STANDALONE_IP}}
        aliases:
            - "raptor-redis-standalone"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.25'

  # Backup sidecar (VIE01-369 Phase 1, see docs/backup-restore-v0.5.md).
  redis-standalone-backup:
    image: offen/docker-volume-backup:v2.50.0
    container_name: raptor-redis-standalone-backup-${RAPTOR_VERSION}
    environment:
      EXEC_LABEL: "02-redis-standalone"
      BACKUP_CRON_EXPRESSION: ${REDIS_BACKUP_CRON:-0 3 * * *}
      BACKUP_FILENAME: "02-redis-standalone-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "02-redis-standalone-"
      BACKUP_RETENTION_DAYS: ${REDIS_BACKUP_RETENTION_DAYS:-30}
      AGE_PUBLIC_KEYS: ${AGE_PUBLIC_KEYS}
      NOTIFICATION_URLS: ${BACKUP_NOTIFICATION_URLS:-}
      NOTIFICATION_LEVEL: error
      SSH_HOST_NAME: ${BACKUP_SSH_HOST_NAME:-}
      SSH_PORT: ${BACKUP_SSH_PORT:-22}
      SSH_USER: ${BACKUP_SSH_USER:-}
      SSH_PASSWORD: ${BACKUP_SSH_PASSWORD:-}
      SSH_IDENTITY_FILE: ${BACKUP_SSH_IDENTITY_FILE:-}
      SSH_REMOTE_PATH: ${BACKUP_SSH_REMOTE_PATH:-/backups/raptor}
      SSH_HOST_PUBLIC_KEY: ${BACKUP_SSH_HOST_PUBLIC_KEY:-}
      SSH_KNOWN_HOSTS_FILE: ${BACKUP_SSH_KNOWN_HOSTS_FILE:-}
      SSH_IGNORE_HOST_KEY: ${BACKUP_SSH_IGNORE_HOST_KEY:-false}
      WEBDAV_URL: ${BACKUP_WEBDAV_URL:-}
      WEBDAV_PATH: ${BACKUP_WEBDAV_PATH:-}
      WEBDAV_USERNAME: ${BACKUP_WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${BACKUP_WEBDAV_PASSWORD:-}
      TZ: ${TIMEZONE:-Asia/Taipei}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - redis-standalone-backup-staging:/backup/redis-standalone
      - ${BACKUP_LOCAL_ARCHIVE_PATH:-./backup-archive-default}:/archive
    depends_on:
      redis-standalone:
        condition: service_healthy
    networks:
      raptor:
        aliases:
          - raptor-redis-standalone-backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

volumes:
  redis1-data:
  redis2-data:
  redis3-data:
  redis4-data:
  redis5-data:
  redis6-data:
  redisinsight-data:
  redis-standalone-data:
  redis-standalone-backup-staging:

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
