# Redis Cluster Module
# Aigle Platform v0.2
# Deploy: docker-compose -f docker-compose.yml up -d

services:
  redis1:
    image: redis:8.0.2
    container_name: raptor-redis1-${RAPTOR_VERSION}
    hostname: raptor-redis1
    profiles: ["cluster"]
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port ${PORT_REDIS_CLUSTER_1:-7000}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-announce-ip ${HOST_IP}
      --cluster-announce-port ${PORT_REDIS_CLUSTER_1:-7000}
      --cluster-announce-bus-port ${PORT_REDIS_CLUSTER_BUS_1:-17000}
    ports:
      - "${PORT_REDIS_CLUSTER_1:-7000}:${PORT_REDIS_CLUSTER_1:-7000}"
      - "${PORT_REDIS_CLUSTER_BUS_1:-17000}:${PORT_REDIS_CLUSTER_BUS_1:-17000}"
    volumes:
      - redis1-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Taipei}
    networks:
      raptor:
        aliases:
            - "raptor-redis1"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "${PORT_REDIS_CLUSTER_1:-7000}", "cluster", "info"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  redis2:
    image: redis:8.0.2
    container_name: raptor-redis2-${RAPTOR_VERSION}
