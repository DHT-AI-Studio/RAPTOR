    networks:
      raptor:
        # ${REDIS_CLUSTER_IP_3:+ipv4_address: ${REDIS_CLUSTER_IP_3}}
        aliases:
            - "raptor-redis3"  # 定義別名
    restart: unless-stopped
    healthcheck:
