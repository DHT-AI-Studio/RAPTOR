# A public entry point for the gRPC gateway: TLS and HTTP/2 from the internet to this nginx,
# plaintext HTTP/2 from nginx to the gateway on the private network. Not a test config: fill in the
# three <...> values and install it on the machine that has the public address.
#
#   <PUBLIC_NAME>   a DNS name WITHOUT underscores (underscores break TLS host-name checks and
#                   certificate issuance), e.g. raptor-grpc.example.com
#   <GATEWAY_HOST>  the private address of the machine running grpc-gateway (port 8825)
#   certificate     a valid, unexpired certificate for <PUBLIC_NAME> (a wildcard is fine)
#
# Verify from OUTSIDE the network: scripts/external_check.py (see docs/_internal/external-access.md).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream grpc_backend {
        server <GATEWAY_HOST>:8825;
    }

    server {
        listen 8825 ssl http2;
        server_name <PUBLIC_NAME>;
        ssl_certificate     /etc/ssl/raptor/fullchain.pem;
        ssl_certificate_key /etc/ssl/raptor/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The gateway lists every RPC to anyone who asks and without a token. Do not expose that.
        location ~ ^/grpc\.reflection\. {
            return 404;
        }

        location / {
            grpc_pass grpc://grpc_backend;

            # Streaming RPCs (UploadAsset, DownloadAsset, WatchJob) can run for a long time.
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            client_body_timeout 3600s;

            # Without this an UploadAsset over 1 MiB fails with HTTP 413.
            client_max_body_size 0;
        }
    }
}
