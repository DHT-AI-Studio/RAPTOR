# nginx terminating TLS in front of grpc-gateway: clients speak TLS (HTTP/2, ALPN h2) to nginx, nginx
# speaks plaintext HTTP/2 to the gateway on the private network. Same gRPC settings as nginx.conf.
#
# Certificates: proxy-test/make_certs.sh makes throwaway ones; mount them at /certs.
# Verify: grpcurl -cacert proxy-test/certs/ca.pem -authority localhost -H "authorization: Bearer <jwt>" \
#           -d '{"message":"hi"}' localhost:8828 raptor.v1.RaptorService/Ping
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream grpc_backend {
        server grpc-gateway:8825;
    }

    server {
        # `ssl http2` is required: gRPC needs HTTP/2, and over TLS the client negotiates it with ALPN.
        listen 8828 ssl http2;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            grpc_pass grpc://grpc_backend;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            client_body_timeout 3600s;

            # See nginx.conf: without this an UploadAsset over 1 MiB fails with HTTP 413.
            client_max_body_size 0;
        }
    }
}
