# Minimal nginx gRPC proxy in front of grpc-gateway, HTTP/2 end to end.
# nginx has natively understood gRPC (grpc_pass, not the generic proxy_pass)
# since 1.13.10 -- no third-party module needed.
#
# Verify: grpcurl -plaintext -H "authorization: Bearer x" localhost:8826 raptor.v1.RaptorService/Ping
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream grpc_backend {
        server grpc-gateway:8825;
    }

    server {
        # listen ... http2 is required -- gRPC is always HTTP/2, nginx will
        # not proxy it correctly over HTTP/1.1.
        listen 8826 http2;

        location / {
            grpc_pass grpc://grpc_backend;

            # gRPC calls (especially the streaming ones -- DownloadAsset,
            # UploadAsset, WatchJob) are long-lived; nginx's defaults are
            # tuned for short HTTP requests and will otherwise cut a slow
            # stream off mid-flight.
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            client_body_timeout 3600s;

            # nginx counts every message of a client-streaming call (UploadAsset)
            # toward client_max_body_size, whose default is 1 MiB: an upload over
            # 1 MiB was cut off with HTTP 413 ("client intended to send too large
            # chunked body"), seen through this exact config. 0 turns the limit off;
            # the gateway enforces its own limits (per-user stream cap, idle timeout).
            client_max_body_size 0;
        }
    }
}
