# Minimal Envoy gRPC proxy in front of grpc-gateway, HTTP/2 end to end.
#
# Verify: grpcurl -plaintext -H "authorization: Bearer x" localhost:8827 raptor.v1.RaptorService/Ping
static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8827
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_gateway_ingress
                codec_type: AUTO
                # http2_protocol_options (even empty) is what tells Envoy to
                # speak HTTP/2 on this listener -- gRPC does not work over
                # plain HTTP/1.1, and Envoy defaults new listeners to HTTP/1.1.
                http2_protocol_options: {}
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_gateway
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: grpc_gateway_cluster
                            # Streaming RPCs (DownloadAsset/UploadAsset/WatchJob)
                            # are long-lived; Envoy's default route timeout (15s)
                            # would otherwise kill them mid-stream.
                            timeout: 3600s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: grpc_gateway_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # http2_protocol_options here (not just on the listener) is what makes
      # Envoy speak HTTP/2 to the *upstream* grpc-gateway too -- without it,
      # Envoy defaults to HTTP/1.1 for the backend connection and every call
      # fails.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_gateway_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: grpc-gateway
                      port_value: 8825

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
