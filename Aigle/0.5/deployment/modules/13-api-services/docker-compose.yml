services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: raptor/api-gateway:${RAPTOR_VERSION}
    container_name: raptor-api-gateway-${RAPTOR_VERSION}
    restart: always
    # CF-3: public entry point -- the API gateway is the only HTTP ingress for clients; it must stay published.
    ports:
      - "${PORT_API_GATEWAY:-8012}:8012"
    env_file:
      - .env
      - path: ../.env
        required: false
    environment:
      # GD-1 / VIE01-246: shared secret this gateway presents to Module 33 as
      # X-Internal-Token. GD_INTERNAL_TOKEN stays the single source of truth;
      # expanded here since env_file: doesn't do ${VAR} interpolation on its own.
      GATEWAY_GDPR_INTERNAL_TOKEN: ${GD_INTERNAL_TOKEN:-}
      # VIE01-369: same shared secret scripts/nfs-freeze-archive.sh presents
      # as X-Internal-Token to /admin/maintenance/*. NFS_BACKUP_GATEWAY_INTERNAL_TOKEN
      # (root .env's "01" Backup section) stays the single source of truth --
      # same reason as GD_INTERNAL_TOKEN above, this must be expanded here,
      # not left to env_file:, confirmed live: env_file: injects it as the
      # literal, unexpanded string "${NFS_BACKUP_GATEWAY_INTERNAL_TOKEN}"
      # otherwise, which would never match any real caller's token.
      GATEWAY_INTERNAL_ADMIN_TOKEN: ${NFS_BACKUP_GATEWAY_INTERNAL_TOKEN:-}
    volumes:
      - ./app:/app/app
      - media-tmp:/tmp/media_processing
    networks:
      raptor:
        aliases:
          - "raptor-api-gateway"
    labels:
      - "com.example.description=VIE FastAPI Gateway Application"

  upload-cleanup:
    image: busybox:1.36.1
    container_name: raptor-upload-cleanup-${RAPTOR_VERSION}
    volumes:
      - media-tmp:/tmp/media_processing
    command:
      - sh
      - -c
      - |
        while true; do
          find /tmp/media_processing/uploads -mindepth 1 -maxdepth 1 -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
          sleep 3600
        done
    restart: unless-stopped
    networks:
      raptor:
        aliases:
          - "raptor-upload-cleanup"

volumes:
  media-tmp:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NFS_SERVER},nfsvers=4,port=${PORT_NFS}"
      device: ":${NFS_MEDIA_TMP_PATH}"

networks:
  raptor:
    external: true
    name: ${DOCKER_NETWORK:-raptor}
