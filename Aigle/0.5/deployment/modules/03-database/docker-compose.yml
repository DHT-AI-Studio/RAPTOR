  # PostgreSQL Database
  raptor-postgres:
    image: postgres:15
    container_name: raptor-postgres-${RAPTOR_VERSION}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raptor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raptor}
      POSTGRES_DB: ${POSTGRES_DB:-raptor}
      TZ: ${TIMEZONE:-Asia/Taipei}
    ports:
      - "${PORT_POSTGRES:-5433}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./init/postgresql:/docker-entrypoint-initdb.d:ro
      - postgres-backup-staging:/backup-staging
    # VIE01-369 Phase 1: execs inside this container via the backup sidecar's archive-pre hook.
    labels:
      - "docker-volume-backup.exec-label=03-postgres"
      - >-
        docker-volume-backup.archive-pre=sh -c '
        for db in mlflow asset_management gateway benchmark personal_db guardrails privacy_compliance realtime_audio; do
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -U $$POSTGRES_USER -d $$db --format=custom -f /backup-staging/$$db.dump;
        done'
    networks:
      raptor:
        aliases:
          - "raptor-postgres"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raptor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: raptor-qdrant-${RAPTOR_VERSION}
    hostname: raptor-qdrant
    environment:
      TZ: ${TIMEZONE:-Asia/Taipei}
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    ports:
      - "${PORT_QDRANT:-6333}:6333"
      - "${PORT_QDRANT_GRPC:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
      # - ./config/qdrant/config.yaml:/qdrant/config/config.yaml:ro
    networks:
      raptor:
        aliases:
          - "raptor-qdrant"  # 定義別名
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'

  # Backup sidecar (VIE01-369 Phase 1, see docs/backup-restore-v0.5.md).
  postgres-backup:
    image: offen/docker-volume-backup:v2.50.0
    container_name: raptor-postgres-backup-${RAPTOR_VERSION}
    environment:
      EXEC_LABEL: "03-postgres"
      BACKUP_CRON_EXPRESSION: ${POSTGRES_BACKUP_CRON:-0 3 * * *}
      BACKUP_FILENAME: "03-postgres-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "03-postgres-"
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-30}
      AGE_PUBLIC_KEYS: ${AGE_PUBLIC_KEYS}
      NOTIFICATION_URLS: ${BACKUP_NOTIFICATION_URLS:-}
      NOTIFICATION_LEVEL: error
      TZ: ${TIMEZONE:-Asia/Taipei}
      # Destination: any combination; blank ones are skipped.
      SSH_HOST_NAME: ${BACKUP_SSH_HOST_NAME:-}
      SSH_PORT: ${BACKUP_SSH_PORT:-22}
      SSH_USER: ${BACKUP_SSH_USER:-}
      SSH_PASSWORD: ${BACKUP_SSH_PASSWORD:-}
      SSH_IDENTITY_FILE: ${BACKUP_SSH_IDENTITY_FILE:-}
      SSH_REMOTE_PATH: ${BACKUP_SSH_REMOTE_PATH:-/backups/raptor}
      SSH_HOST_PUBLIC_KEY: ${BACKUP_SSH_HOST_PUBLIC_KEY:-}
      SSH_KNOWN_HOSTS_FILE: ${BACKUP_SSH_KNOWN_HOSTS_FILE:-}
      SSH_IGNORE_HOST_KEY: ${BACKUP_SSH_IGNORE_HOST_KEY:-false}
      WEBDAV_URL: ${BACKUP_WEBDAV_URL:-}
      WEBDAV_PATH: ${BACKUP_WEBDAV_PATH:-}
      WEBDAV_USERNAME: ${BACKUP_WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${BACKUP_WEBDAV_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - postgres-backup-staging:/backup/postgres
      # Local/pre-mounted-NFS destination; a mount here at all enables it.
      - ${BACKUP_LOCAL_ARCHIVE_PATH:-./backup-archive-default}:/archive
    depends_on:
      raptor-postgres:
        condition: service_healthy
    networks:
      raptor:
        aliases:
          - raptor-postgres-backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  # Adminer (Database Management UI)
