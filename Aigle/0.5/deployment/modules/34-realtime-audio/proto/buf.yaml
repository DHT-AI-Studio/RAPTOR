# buf configuration for raptor.audio.v1 (module root = this directory):
#   buf lint proto && buf breaking proto --against '<repo>/.git#ref=origin/main,subdir=deployment/modules/34-realtime-audio/proto'
# Same rules as 36-grpc-gateway/proto/buf.yaml. AudioChat's message names (AudioChunk /
# AudioEvent) are fixed by RA-6, so the two request/response naming rules are off.
version: v2
lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
