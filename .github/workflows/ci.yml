name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only the commits in this push / pull request, so secrets that are
      # already in old history do not fail every build. Revoke those separately.
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  link-check:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline mode checks relative links between files in the repo only, so
      # the job never fails because an external website is slow or down.
      # Scope: root docs, community guidelines, and the current release (Aigle 0.5).
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --offline
            --no-progress
            README.md
            FINAL_SUMMARY.md
            GITHUB_SETUP_INFO.md
            'COMMUNITY_GUIDELINES/**/*.md'
            'MAIN_DOCUMENTATION/**/*.md'
            'Aigle/0.5/**/*.md'
